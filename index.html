/* ================= CHARACTER DATA ================= */
const CHARACTERS = [

];
const TOTAL_ITEMS = 10;
const COLS = 15, ROWS = 15;
const CELL = 32;

/* ================= STATE ================= */
let CLIENT_ID = null;
let LOBBY_CODE = null;
let MY_SLOT = null;
let IS_HOST = false;
let META = null;
let maze = null;
let player = {r:0,c:0};
let myPos = null;
let opponentsPos = {};
let mode = 'landing';
let metaUnsub = null;
let posUnsubs = {};
let writeTimer = null;
let gameStarted = false;
let countdownTimer = null;
let canvas, ctx;

/* ================= CLIENT ID (localStorage - reálný hosting) ================= */
function ensureClientId(){
  try{
    let id = localStorage.getItem('orion_client_id');
    if(!id){
      id = 'c' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('orion_client_id', id);
    }
    CLIENT_ID = id;
  }catch(e){
    CLIENT_ID = 'c' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
}

/* ================= FIRESTORE HELPERS ================= */
function lobbyRef(code){ return db.collection(COLLECTION).doc(code); }
function posRef(code, slot){ return db.collection(COLLECTION).doc(code).collection('pos').doc(String(slot)); }

function objToArray(x, expectedLen){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object'){
    const arr = [];
    for(let i=0;i<expectedLen;i++) arr.push(x[i] !== undefined ? x[i] : null);
    return arr;
  }
  return new Array(expectedLen).fill(null);
}
function normalizeMeta(m){
  if(!m) return null;
  m.slots = objToArray(m.slots, 3).map(s => s || {name:null, charId:null, ready:false, clientId:null});
  m.maze = objToArray(m.maze, COLS*ROWS).map(v => v || 0);
  return m;
}

async function readMetaOnce(code){
  const snap = await lobbyRef(code).get();
  return snap.exists ? normalizeMeta(snap.data()) : null;
}
async function readPosOnce(code, slot){
  const snap = await posRef(code, slot).get();
  return snap.exists ? snap.data() : null;
}
async function writePosObj(code, slot, obj){
  await posRef(code, slot).set(obj);
}
async function deletePosObj(code, slot){
  try{ await posRef(code, slot).delete(); }catch(e){}
}

/* ================= MAZE ================= */
function generateMaze(cols, rows){
  const grid = [];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let c=0;c<cols;c++) row.push({N:true,E:true,S:true,W:true,visited:false});
    grid.push(row);
  }
  const stack=[{r:0,c:0}];
  grid[0][0].visited=true;
  const opposite={N:'S',S:'N',E:'W',W:'E'};
  function neighbors(r,c){
    const list=[];
    if(r>0 && !grid[r-1][c].visited) list.push({r:r-1,c,dir:'N'});
    if(c<cols-1 && !grid[r][c+1].visited) list.push({r,c:c+1,dir:'E'});
    if(r<rows-1 && !grid[r+1][c].visited) list.push({r:r+1,c,dir:'S'});
    if(c>0 && !grid[r][c-1].visited) list.push({r,c:c-1,dir:'W'});
    return list;
  }
  while(stack.length){
    const cur = stack[stack.length-1];
    const opts = neighbors(cur.r, cur.c);
    if(opts.length===0){ stack.pop(); continue; }
    const pick = opts[Math.floor(Math.random()*opts.length)];
    grid[cur.r][cur.c][pick.dir]=false;
    grid[pick.r][pick.c][opposite[pick.dir]]=false;
    grid[pick.r][pick.c].visited=true;
    stack.push({r:pick.r,c:pick.c});
  }
  return grid;
}
function serializeMazeFlat(g){
  const flat=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=g[r][c];
    flat.push((cell.N?1:0)+(cell.E?2:0)+(cell.S?4:0)+(cell.W?8:0));
  }
  return flat;
}
function deserializeMazeFlat(flat){
  const g=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++){
      const v = flat[r*COLS+c] || 0;
      row.push({N:!!(v&1),E:!!(v&2),S:!!(v&4),W:!!(v&8)});
    }
    g.push(row);
  }
  return g;
}
function randomEmptyCell(mz, avoid){
  let r,c;
  do{ r=Math.floor(Math.random()*ROWS); c=Math.floor(Math.random()*COLS); }
  while(avoid && r===avoid.r && c===avoid.c);
  return {r,c};
}

/* ================= SCREEN HELPERS ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function msg(id, text){ document.getElementById(id).textContent = text || ''; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ================= LANDING ================= */
document.getElementById('tabCreateBtn').addEventListener('click', ()=>{
  document.getElementById('tabCreateBtn').classList.add('active');
  document.getElementById('tabJoinBtn').classList.remove('active');
  document.getElementById('createTab').style.display='flex';
  document.getElementById('joinTab').style.display='none';
});
document.getElementById('tabJoinBtn').addEventListener('click', ()=>{

  document.getElementById('tabCreateBtn').classList.remove('active');

  document.getElementById('createTab').style.display='none';
});
document.getElementById('createLobbyBtn').addEventListener('click', createLobby);
document.getElementById('joinLobbyBtn').addEventListener('click', joinLobby);

function randomCode(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function createLobby(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ msg('landingMsg','Zadej svoje jméno.'); return; }
  msg('landingMsg','Zakládám lobby…');
  const code = randomCode(5);
  const generated = generateMaze(COLS, ROWS);
  const metaObj = {
    code, createdAt: Date.now(),
    maze: serializeMazeFlat(generated),
    slots: [
      {name, charId:null, ready:false, clientId:CLIENT_ID},
      {name:null, charId:null, ready:false, clientId:null},
      {name:null, charId:null, ready:false, clientId:null}
    ],
    status:'lobby', winnerSlot:null, startAt:null
  };
  try{
    await lobbyRef(code).set(metaObj);
  }catch(e){
    msg('landingMsg','Nepodařilo se založit lobby: ' + e.message);
    return;
  }
  LOBBY_CODE = code; MY_SLOT = 0; IS_HOST = true; META = metaObj; maze = generated;
  msg('landingMsg','');
  enterLobby();
}

async function joinLobby(){
  const name = document.getElementById('nameInputJoin').value.trim();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if(!name || !code){ msg('landingMsg','Vyplň jméno i kód.'); return; }
  msg('landingMsg','Připojuji se…');

  let joinedSlot = null;
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(code);
      const snap = await tx.get(docRef);
      if(!snap.exists) throw new Error('NOT_FOUND');
      const data = normalizeMeta(snap.data());
      let slotIdx = data.slots.findIndex(s => s.clientId === CLIENT_ID);
      if(slotIdx === -1){
        slotIdx = data.slots.findIndex(s => s.name === null);
        if(slotIdx === -1) throw new Error('FULL');
        data.slots[slotIdx] = {name, charId:null, ready:false, clientId:CLIENT_ID};
      }
      joinedSlot = slotIdx;
      tx.set(docRef, data);
    });
  }catch(e){
    if(e.message === 'NOT_FOUND'){ msg('landingMsg','Lobby s tímto kódem nenalezeno.'); return; }
    if(e.message === 'FULL'){ msg('landingMsg','Lobby je plná.'); return; }
    msg('landingMsg','Nepodařilo se připojit: ' + e.message);
    return;
  }

  LOBBY_CODE = code; MY_SLOT = joinedSlot; IS_HOST = (joinedSlot === 0);
  msg('landingMsg','');
  const metaNow = await readMetaOnce(code);
  META = metaNow;
  maze = deserializeMazeFlat(metaNow.maze);
  enterLobby();
}

/* ================= LOBBY ================= */
function enterLobby(){
  mode = 'lobby';
  showScreen('lobbyScreen');
  document.getElementById('lobbyCode').textContent = LOBBY_CODE;
  renderLobby();
  attachMetaListener();
}

function attachMetaListener(){
  if(metaUnsub) metaUnsub();
  metaUnsub = lobbyRef(LOBBY_CODE).onSnapshot(snap => {
    if(!snap.exists) return;
    META = normalizeMeta(snap.data());
    onMetaChange();
  }, err => {
    document.getElementById('connStatus').textContent = 'offline';
    document.getElementById('connStatus').className = 'bad';
  });
}

function onMetaChange(){
  if(mode === 'lobby'){
    renderLobby();
    if(META.status === 'playing'){
      maze = deserializeMazeFlat(META.maze);
      beginGame();
    }
  } else if(mode === 'playing'){
    if(META.status === 'finished'){
      enterFinished();
    }
  } else if(mode === 'finished'){
    if(META.status === 'lobby'){
      maze = deserializeMazeFlat(META.maze);
      backToLobbyFromFinished();
    }
  }
}

function renderLobby(){
  const cont = document.getElementById('slotsContainer');
  cont.innerHTML = '';
  META.slots.forEach((slot, idx) => {
    const row = document.createElement('div');
    row.className = 'slotRow';
    const filled = slot.name !== null;
    const charObj = CHARACTERS.find(c => c.id === slot.charId);
    const top = document.createElement('div');
    top.style.display='flex'; top.style.alignItems='center'; top.style.gap='10px'; top.style.width='100%';
    top.innerHTML = `
      <div class="slotName">${filled ? escapeHtml(slot.name) : 'čeká na hráče…'}</div>
      <div class="slotChar">${charObj ? `<img class="miniAvatar" src="${charObj.img}"><span>${charObj.name}</span>` : (filled ? '<span class="muted">nepřiřazeno</span>' : '')}</div>
      <div class="readyDot ${slot.ready ? 'ready' : ''}"></div>
    `;
    row.appendChild(top);
    if(IS_HOST && filled){
      const assignWrap = document.createElement('div');
      assignWrap.className = 'assignRow';
      CHARACTERS.forEach(ch => {
        const takenBy = META.slots.findIndex(s => s.charId === ch.id);
        const disabled = takenBy !== -1 && takenBy !== idx;
        const btn = document.createElement('button');
        btn.className = 'miniCharBtn' + (slot.charId === ch.id ? ' selected' : '') + (disabled ? ' disabled' : '');
        btn.title = ch.name;
        btn.innerHTML = `<img src="${ch.img}">`;
        if(!disabled) btn.addEventListener('click', () => assignCharacter(idx, ch.id));
        assignWrap.appendChild(btn);
      });
      row.appendChild(assignWrap);
    }
    if(slot.clientId === CLIENT_ID){
      const readyBtn = document.createElement('button');
      readyBtn.className = 'mainBtn small';
      readyBtn.textContent = slot.ready ? 'Připraven/a ✔' : 'Připravit se';
      readyBtn.disabled = !slot.charId;
      readyBtn.addEventListener('click', toggleReady);
      row.appendChild(readyBtn);
    }
    cont.appendChild(row);
  });

  const allFilled = META.slots.every(s => s.name !== null);
  const allChars = META.slots.every(s => s.charId !== null);
  const allReady = META.slots.every(s => s.ready === true);
  const startBtn = document.getElementById('startBtn');
  if(IS_HOST){
    startBtn.style.display = 'inline-block';
    startBtn.disabled = !(allFilled && allChars && allReady);
  } else {
    startBtn.style.display = 'none';
  }
}

async function assignCharacter(slotIdx, charId){
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(LOBBY_CODE);
      const snap = await tx.get(docRef);
      if(!snap.exists) throw new Error('gone');
      const data = normalizeMeta(snap.data());
      if(data.slots.some((s,i) => s.charId === charId && i !== slotIdx)) throw new Error('taken');
      data.slots[slotIdx].charId = charId;
      data.slots[slotIdx].ready = false;
      tx.set(docRef, data);
    });
  }catch(e){ /* race - listener dorovná stav */ }
}

async function toggleReady(){
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(LOBBY_CODE);
      const snap = await tx.get(docRef);
      if(!snap.exists) throw new Error('gone');
      const data = normalizeMeta(snap.data());
      data.slots[MY_SLOT].ready = !data.slots[MY_SLOT].ready;
      tx.set(docRef, data);
    });
  }catch(e){}
}

document.getElementById('startBtn').addEventListener('click', async () => {
  let ok = true;
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(LOBBY_CODE);
      const snap = await tx.get(docRef);
      if(!snap.exists) throw new Error('gone');
      const data = normalizeMeta(snap.data());
      const allFilled = data.slots.every(s => s.name !== null);
      const allChars = data.slots.every(s => s.charId !== null);
      const allReady = data.slots.every(s => s.ready === true);
      if(!(allFilled && allChars && allReady)) throw new Error('notready');
      data.status = 'playing';
      data.startAt = Date.now() + 3000;
      data.winnerSlot = null;
      tx.set(docRef, data);
    });
  }catch(e){ ok = false; }
  if(!ok) msg('lobbyMsg','Ještě nejsou všichni připraveni.');
});

/* ================= GAME ================= */
async function beginGame(){
  if(mode === 'playing') return;
  mode = 'playing';
  gameStarted = false;
  showScreen('gameScreen');
  document.getElementById('hudCode').textContent = LOBBY_CODE;
  canvas = document.getElementById('board');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
  ctx = canvas.getContext('2d');

  let pos = await readPosOnce(LOBBY_CODE, MY_SLOT);
  if(!pos){
    pos = { r:0, c:0, collected:0, itemPos: randomEmptyCell(maze, {r:0,c:0}), lastLine:'', ts:Date.now() };
    await writePosObj(LOBBY_CODE, MY_SLOT, pos);
  }
  myPos = pos;
  player.r = pos.r; player.c = pos.c;
  opponentsPos = {};
  buildScoreboard();
  attachPosListeners();
  handleCountdown();
  drawGame();
}

function attachPosListeners(){
  Object.values(posUnsubs).forEach(unsub => unsub());
  posUnsubs = {};
  META.slots.forEach((slot, s) => {
    if(s === MY_SLOT || !slot.name) return;
    const unsub = posRef(LOBBY_CODE, s).onSnapshot(snap => {
      if(!snap.exists) return;
      opponentsPos[s] = snap.data();
      const el = document.getElementById('scoreVal-' + s);
      if(el) el.textContent = opponentsPos[s].collected;
      drawGame();
    });
    posUnsubs[s] = unsub;
  });
}

function myChar(){ return CHARACTERS.find(c => c.id === META.slots[MY_SLOT].charId); }

function handleCountdown(){
  clearInterval(countdownTimer);
  const overlay = document.getElementById('countdownOverlay');
  const startAt = META.startAt || Date.now();
  const tick = () => {
    const remain = Math.max(0, Math.ceil((startAt - Date.now()) / 1000));
    if(remain > 0){
      overlay.style.display = 'flex';
      document.getElementById('countdownNum').textContent = remain;
    } else {
      overlay.style.display = 'none';
      clearInterval(countdownTimer);
      gameStarted = true;
    }
  };
  countdownTimer = setInterval(tick, 200);
  tick();
}

function buildScoreboard(){
  const board = document.getElementById('scoreboard');
  board.innerHTML = '';
  META.slots.forEach((slot, idx) => {
    if(!slot.name) return;
    const ch = CHARACTERS.find(c => c.id === slot.charId);
    const item = document.createElement('div');
    item.className = 'scoreItem' + (idx === MY_SLOT ? ' me' : '');
    item.id = 'score-' + idx;
    item.innerHTML = `<img src="${ch ? ch.img : ''}"><span>${escapeHtml(slot.name)}: <b id="scoreVal-${idx}">0</b>/${TOTAL_ITEMS}</span>`;
    board.appendChild(item);
  });
}

function drawGame(){
  if(!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#10131a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#3a4152';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for(let r = 0; r < ROWS; r++){
    for(let c = 0; c < COLS; c++){
      const cell = maze[r][c];
      const x = c * CELL, y = r * CELL;
      ctx.beginPath();
      if(cell.N){ ctx.moveTo(x, y); ctx.lineTo(x + CELL, y); }
      if(cell.E){ ctx.moveTo(x + CELL, y); ctx.lineTo(x + CELL, y + CELL); }
      if(cell.S){ ctx.moveTo(x, y + CELL); ctx.lineTo(x + CELL, y + CELL); }
      if(cell.W){ ctx.moveTo(x, y); ctx.lineTo(x, y + CELL); }
      ctx.stroke();
    }
  }
  const ch = myChar();
  if(myPos && myPos.itemPos && ch){
    ctx.font = (CELL * 0.55) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch.itemEmoji, myPos.itemPos.c * CELL + CELL / 2, myPos.itemPos.r * CELL + CELL / 2);
  }
  Object.keys(opponentsPos).forEach(slotStr => {
    const slot = parseInt(slotStr, 10);
    const p = opponentsPos[slot];
    const oppCh = CHARACTERS.find(c => c.id === META.slots[slot].charId);
    if(!oppCh) return;
    drawAvatar(p.c * CELL + CELL / 2, p.r * CELL + CELL / 2, CELL * 0.30, oppCh, 0.75);
  });
  if(ch) drawAvatar(player.c * CELL + CELL / 2, player.r * CELL + CELL / 2, CELL * 0.42, ch, 1);
}

const imgCache = {};
function drawAvatar(px, py, radius, ch, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(px, py, radius, 0, Math.PI * 2);
  ctx.closePath();
  ctx.strokeStyle = '#4fd1c5';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip();
  if(!imgCache[ch.id]){
    const im = new Image();
    im.src = ch.img;
    imgCache[ch.id] = im;
  }
  const im = imgCache[ch.id];
  if(im.complete && im.naturalWidth){
    ctx.drawImage(im, px - radius, py - radius, radius * 2, radius * 2);
  } else {
    im.onload = () => drawGame();
    ctx.fillStyle = '#555';
    ctx.fill();
  }
  ctx.restore();
}

function queuePosWrite(){
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => { writePosObj(LOBBY_CODE, MY_SLOT, myPos); }, 150);
}

function tryMove(dr, dc){
  if(!gameStarted || mode !== 'playing') return;
  const cell = maze[player.r][player.c];
  let dir = null;
  if(dr === -1) dir = 'N'; else if(dr === 1) dir = 'S'; else if(dc === 1) dir = 'E'; else if(dc === -1) dir = 'W';
  if(cell[dir]) return;
  const nr = player.r + dr, nc = player.c + dc;
  if(nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;
  player.r = nr; player.c = nc;
  myPos.r = nr; myPos.c = nc;
  checkPickup();
  drawGame();
  queuePosWrite();
}

function checkPickup(){
  if(myPos.itemPos && player.r === myPos.itemPos.r && player.c === myPos.itemPos.c){
    myPos.collected++;
    const ch = myChar();
    const line = ch.lines[Math.floor(Math.random() * ch.lines.length)];
    myPos.lastLine = line;
    showSpeech(line);
    const scoreVal = document.getElementById('scoreVal-' + MY_SLOT);
    if(scoreVal) scoreVal.textContent = myPos.collected;
    if(myPos.collected >= TOTAL_ITEMS){
      myPos.itemPos = null;
      declareWin();
    } else {
      myPos.itemPos = randomEmptyCell(maze, player);
    }
  }
}

function showSpeech(text){
  const bubble = document.getElementById('speechBubble');
  bubble.textContent = text;
  const px = player.c * CELL;
  const py = player.r * CELL;
  bubble.style.left = Math.min(px, canvas.width - 220) + 'px';
  bubble.style.top = Math.max(py - 44, 0) + 'px';
  bubble.classList.add('show');
  clearTimeout(bubble._t);
  bubble._t = setTimeout(() => bubble.classList.remove('show'), 1500);
}

async function declareWin(){
  gameStarted = false;
  await writePosObj(LOBBY_CODE, MY_SLOT, myPos);
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(LOBBY_CODE);
      const snap = await tx.get(docRef);
      if(!snap.exists) throw new Error('gone');
      const data = normalizeMeta(snap.data());
      if(data.status === 'finished') throw new Error('already');
      data.status = 'finished';
      data.winnerSlot = MY_SLOT;
      tx.set(docRef, data);
    });
  }catch(e){ /* už dřív vyhrál někdo jiný, v pořádku */ }
  const fresh = await readMetaOnce(LOBBY_CODE);
  if(fresh) META = fresh;
  enterFinished();
}

document.addEventListener('keydown', (e) => {
  if(mode !== 'playing') return;
  switch(e.key){
    case 'ArrowUp': case 'w': case 'W': tryMove(-1, 0); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': tryMove(1, 0); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': tryMove(0, -1); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': tryMove(0, 1); e.preventDefault(); break;
  }
});

/* ================= FINISHED ================= */
function enterFinished(){
  mode = 'finished';
  clearInterval(countdownTimer);
  clearTimeout(writeTimer);
  showScreen('finishedScreen');
  const winnerSlot = META.winnerSlot;
  const winnerInfo = META.slots[winnerSlot];
  const champ = CHARACTERS.find(c => c.id === (winnerInfo ? winnerInfo.charId : null));
  const isMe = winnerSlot === MY_SLOT;
  document.getElementById('finishedText').textContent =
    (isMe ? 'Vyhrál jsi ty' : `Vyhrál ${winnerInfo ? winnerInfo.name : '?'}`) +
    (champ ? ` jako ${champ.name}!` : '!');
  document.getElementById('newGameBtn').style.display = IS_HOST ? 'inline-block' : 'none';
}

document.getElementById('newGameBtn').addEventListener('click', async () => {
  const newMazeFlat = serializeMazeFlat(generateMaze(COLS, ROWS));
  try{
    await db.runTransaction(async (tx) => {
      const docRef = lobbyRef(LOBBY_CODE);
      const snap = await tx.get(docRef);
      if(!snap.exists) return;
      const data = normalizeMeta(snap.data());
      data.maze = newMazeFlat;
      data.status = 'lobby';
      data.winnerSlot = null;
      data.startAt = null;
      data.slots.forEach(s => { s.ready = false; });
      tx.set(docRef, data);
    });
  }catch(e){}
  for(let s = 0; s < 3; s++) await deletePosObj(LOBBY_CODE, s);
});

function backToLobbyFromFinished(){
  mode = 'lobby';
  Object.values(posUnsubs).forEach(unsub => unsub());
  posUnsubs = {};
  showScreen('lobbyScreen');
  document.getElementById('lobbyCode').textContent = LOBBY_CODE;
  renderLobby();
}

document.getElementById('leaveBtn').addEventListener('click', () => {
  if(metaUnsub) metaUnsub();
  Object.values(posUnsubs).forEach(unsub => unsub());
  clearInterval(countdownTimer);
  LOBBY_CODE = null; MY_SLOT = null; IS_HOST = false; META = null;
  mode = 'landing';
  showScreen('landingScreen');
});

/* ================= INIT ================= */
ensureClientId();
window.addEventListener('online', () => { document.getElementById('connStatus').textContent='online'; document.getElementById('connStatus').className='ok'; });
window.addEventListener('offline', () => { document.getElementById('connStatus').textContent='offline'; document.getElementById('connStatus').className='bad'; });
</script>
